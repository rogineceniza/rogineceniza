name: Refresh rainy profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 22 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: rainy-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate account visuals and optional editor log
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_WAKATIME: ${{ vars.ENABLE_WAKATIME }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 scripts/update_profile.py
      - name: Save generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/top-languages.svg assets/rainy-city.svg assets/code-activity.svg README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh rainy profile activity'
          git pull --rebase origin main
          git push origin HEAD:main
